<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Discord Translator</title>

    <script type="module" src="./popup.tsx"></script>

    <style>
      html {
        margin: 0;
        padding: 0;

        width: 100%;
        min-height: 100%;

        overflow-x: hidden;
        overflow-y: auto;

        background:
          linear-gradient(
            145deg,
            #050816 0%,
            #0a1020 35%,
            #0d1326 70%,
            #111827 100%
          );

        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "SF Pro Text",
          "PingFang SC",
          sans-serif;
      }

      body {
        margin: 0;
        padding: 0;

        width: 100%;
        min-height: 100%;

        overflow: visible;

        position: relative;
      }

      /* =========================
         SVG FILTER
      ========================= */

      .liquid-svg {
        position: absolute;
        width: 0;
        height: 0;
      }

      /* =========================
         FIXED BACKGROUND
      ========================= */

      .background-layer {
        position: fixed;

        inset: 0;

        z-index: 0;

        overflow: hidden;

        pointer-events: none;
      }

      /* =========================
         LIQUID AURORA
      ========================= */

      .aurora {
        position: absolute;

        width: 60vw;
        height: 60vw;

        min-width: 320px;
        min-height: 320px;

        border-radius: 999px;

        filter: blur(120px);

        opacity: .95;

        mix-blend-mode: screen;

        animation:
          aurora-float 12s ease-in-out infinite alternate,
          aurora-hue 18s linear infinite;
      }

      .aurora-one {
        top: -20%;
        left: -20%;

        background:
          radial-gradient(
            circle,
            rgba(0,122,255,.38),
            transparent 70%
          );
      }

      .aurora-two {
        top: 15%;
        right: -25%;

        background:
          radial-gradient(
            circle,
            rgba(168,85,247,.30),
            transparent 70%
          );

        animation-delay: -6s;
      }

      .aurora-three {
        left: 10%;
        bottom: -30%;

        background:
          radial-gradient(
            circle,
            rgba(16,185,129,.22),
            transparent 70%
          );

        animation-delay: -10s;
      }

      /* =========================
         REACT ROOT
      ========================= */

      #root {
        position: relative;
        z-index: 1;

        width: 100%;
        min-height: 100%;
        overflow: visible;
      }

      /* =========================
         APPLE LIQUID GLASS CARD
      ========================= */

      .liquid-card {
        position: relative;

        overflow: hidden;

        border-radius: 30px;

        background:
          linear-gradient(
            135deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.03)
          );

        border:
          1px solid rgba(255,255,255,.10);

        backdrop-filter:
          blur(30px)
          saturate(140%);

        -webkit-backdrop-filter:
          blur(30px)
          saturate(140%);

        filter:
          url(#liquid-glass);

        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.10),
          inset 0 -1px 0 rgba(255,255,255,.04),
          0 10px 30px rgba(0,0,0,.45);

        transition:
          transform .45s cubic-bezier(.22,1,.36,1),
          box-shadow .45s cubic-bezier(.22,1,.36,1);
      }

      .liquid-card::before {
        content: "";

        position: absolute;
        inset: 0;

        border-radius: inherit;

        background:
          linear-gradient(
            145deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.03) 42%,
            rgba(255,255,255,0) 60%
          );

        pointer-events: none;
      }

      .liquid-card::after {
        content: "";

        position: absolute;

        inset: 1px;

        border-radius: inherit;

        background:
          radial-gradient(
            circle at top left,
            rgba(255,255,255,.10),
            transparent 40%
          );

        mix-blend-mode: screen;

        pointer-events: none;
      }

      .liquid-card:hover {
        transform:
          translateY(-2px)
          scale(1.01);

        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.14),
          inset 0 -1px 0 rgba(255,255,255,.06),
          0 20px 60px rgba(0,0,0,.55);
      }

      /* =========================
         ANIMATIONS
      ========================= */

      @keyframes aurora-float {
        from {
          transform:
            translate3d(-2%, 1%, 0)
            scale(1);
        }

        to {
          transform:
            translate3d(4%, -3%, 0)
            scale(1.08);
        }
      }

      @keyframes aurora-hue {
        from {
          filter:
            blur(120px)
            hue-rotate(0deg);
        }

        to {
          filter:
            blur(120px)
            hue-rotate(25deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- SVG Liquid Glass Filter -->
    <svg
      class="liquid-svg"
      xmlns="http://www.w3.org/2000/svg"
    >
      <filter
        id="liquid-glass"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%"
      >
        <!-- Dynamic Liquid Noise -->

        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.006 0.006"
          numOctaves="2"
          seed="17"
          result="noise"
        />

        <!-- Smooth Refraction -->

        <feGaussianBlur
          in="noise"
          stdDeviation="1.2"
          result="softMap"
        />

        <!-- Glass Distortion -->

        <feDisplacementMap
          in="SourceGraphic"
          in2="softMap"
          scale="18"
          xChannelSelector="R"
          yChannelSelector="G"
        />

        <!-- Specular Highlight -->

        <feSpecularLighting
          in="softMap"
          surfaceScale="2"
          specularConstant="0.55"
          specularExponent="35"
          lighting-color="white"
          result="specLight"
        >
          <fePointLight
            x="-120"
            y="-120"
            z="220"
          />
        </feSpecularLighting>

        <feComposite
          in="specLight"
          in2="SourceAlpha"
          operator="in"
          result="litImage"
        />

        <feBlend
          in="SourceGraphic"
          in2="litImage"
          mode="screen"
        />
      </filter>
    </svg>

    <!-- Independent Background -->
    <div class="background-layer">
      <div class="aurora aurora-one"></div>

      <div class="aurora aurora-two"></div>

      <div class="aurora aurora-three"></div>
    </div>

    <!-- React Root -->
    <div id="root"></div>
  </body>
</html>
